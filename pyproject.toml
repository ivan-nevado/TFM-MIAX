# Workspace-level tooling configuration (ruff, pytest). The installable projects live in
# ml/ (package `relval`) and backend/ (FastAPI service).
[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["legacy", "notebooks", "frontend", "terraform", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E501", "B008", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["relval", "app"]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "backend/tests"]
addopts = "-q --import-mode=importlib"
markers = ["data: needs the licensed data under data/ (skipped in CI)"]
