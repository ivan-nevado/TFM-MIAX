[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relval"
version = "0.1.0"
description = "Replication of Geertsema & Lu (2023), Relative Valuation with Machine Learning"
requires-python = ">=3.10,<3.12"
dependencies = [
  # The paper uses LightGBM 3.2.1; it needs NumPy < 2.
  "lightgbm==3.2.1",
  "numpy>=1.24,<2",
  "pandas>=2.1,<2.3",
  "pyarrow>=14",
  "scikit-learn>=1.4,<1.7",
  "scipy<1.14",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "joblib>=1.3",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pymupdf>=1.24", "python-docx>=1.1"]
s3 = ["s3fs>=2024.2"]

[project.scripts]
relval = "relval.pipelines.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
