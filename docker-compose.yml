# Local stack over the outputs already produced in ./data and ./reports.
#   docker compose up --build        -> UI on http://localhost:8080, API on http://localhost:8000
#   docker compose run --rm pipeline relval replicate
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      RELVAL_DATA_ROOT: /data
      RELVAL_REPORTS_ROOT: /reports
      RELVAL_RUN_NAME: ${RELVAL_RUN_NAME:-replication}
      RELVAL_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    volumes:
      - ./data:/data:ro
      - ./reports:/reports:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

  pipeline:
    profiles: ["pipeline"]
    build:
      context: .
      dockerfile: ml/Dockerfile
    volumes:
      - ./data:/workspace/data
      - ./reports:/workspace/reports
      - ./docs/replication:/workspace/docs/replication
    command: ["relval", "status"]
